<svg xmlns="http://www.w3.org/2000/svg" width="624" height="228" viewBox="0 0 624 228" role="img" aria-label="elfcheck triage of a suspicious binary: a yellow MED, a cyan LOW and a grey INFO finding, exits 2">
<!-- Generated by docs/gen-examples.py from real elfcheck output; tags colored HIGH=red MED=yellow LOW=cyan INFO=grey. -->
<rect x="0.5" y="0.5" width="623" height="227" rx="7" fill="#282c34" stroke="#21252b"/>
<text x="18" y="30" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#5c6370">$</tspan><tspan fill="#abb2bf"> elfcheck --triage ./suspicious</tspan></text>
<text x="18" y="52" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#abb2bf">Triage:</tspan></text>
<text x="18" y="74" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#e5c07b">  [MED]    </tspan><tspan fill="#abb2bf">high-entropy executable section (possibly packed/encrypted)</tspan></text>
<text x="18" y="96" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#56b6c2">  [LOW]    </tspan><tspan fill="#abb2bf">imports command/process execution (system/exec*)</tspan></text>
<text x="18" y="118" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#7f848e">  [INFO]   </tspan><tspan fill="#abb2bf">imports network functions (socket/connect/...)</tspan></text>
<text x="18" y="140" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#abb2bf">  Summary: 0 high, 1 medium, 1 low, 1 info</tspan></text>
<text x="18" y="184" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#5c6370">$</tspan><tspan fill="#abb2bf"> echo $?</tspan></text>
<text x="18" y="206" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#abb2bf">2</tspan></text>
</svg>
