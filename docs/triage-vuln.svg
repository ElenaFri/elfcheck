<svg xmlns="http://www.w3.org/2000/svg" width="624" height="272" viewBox="0 0 624 272" role="img" aria-label="elfcheck triage of a vulnerable binary: a red HIGH finding over cyan LOW findings, exits 2">
<!-- Generated by docs/gen-examples.py from real elfcheck output; tags colored HIGH=red MED=yellow LOW=cyan INFO=grey. -->
<rect x="0.5" y="0.5" width="623" height="271" rx="7" fill="#282c34" stroke="#21252b"/>
<text x="18" y="30" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#5c6370">$</tspan><tspan fill="#abb2bf"> elfcheck --triage ./vuln</tspan></text>
<text x="18" y="52" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#abb2bf">Triage:</tspan></text>
<text x="18" y="74" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#e06c75" font-weight="600">  [HIGH]   </tspan><tspan fill="#abb2bf">executable stack (PT_GNU_STACK is RWX)</tspan></text>
<text x="18" y="96" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#56b6c2">  [LOW]    </tspan><tspan fill="#abb2bf">partial RELRO (GOT not fully protected)</tspan></text>
<text x="18" y="118" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#56b6c2">  [LOW]    </tspan><tspan fill="#abb2bf">no PIE (fixed load address)</tspan></text>
<text x="18" y="140" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#56b6c2">  [LOW]    </tspan><tspan fill="#abb2bf">no stack canary</tspan></text>
<text x="18" y="162" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#56b6c2">  [LOW]    </tspan><tspan fill="#abb2bf">CET not fully enabled (IBT/SHSTK)</tspan></text>
<text x="18" y="184" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#abb2bf">  Summary: 1 high, 0 medium, 4 low, 0 info</tspan></text>
<text x="18" y="228" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#5c6370">$</tspan><tspan fill="#abb2bf"> echo $?</tspan></text>
<text x="18" y="250" xml:space="preserve" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14"><tspan fill="#abb2bf">2</tspan></text>
</svg>
