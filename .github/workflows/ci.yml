name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make gcc python3 kcov

      - name: Build, test, and generate coverage
        run: make coverage

      - name: Run deterministic fuzz smoke tests
        run: make fuzz-smoke

      - name: Verify assembly coverage report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("coverage").rglob("cobertura.xml"))
          if not reports:
              raise SystemExit("kcov did not produce a Cobertura XML report")

          assembly_files = set()
          valid_lines = 0
          covered_lines = 0
          for report in reports:
              root = ET.parse(report).getroot()
              for class_node in root.findall(".//class"):
                  filename = class_node.get("filename", "")
                  if not filename.endswith((".asm", ".inc")):
                      continue
                  assembly_files.add(filename)
                  for line in class_node.findall("./lines/line"):
                      valid_lines += 1
                      covered_lines += int(line.get("hits", "0")) > 0

          if not assembly_files or not valid_lines or not covered_lines:
              raise SystemExit(
                  "kcov report has no executed NASM source lines "
                  f"(files={len(assembly_files)}, valid={valid_lines}, covered={covered_lines})"
              )

          print(
              f"kcov report covers {covered_lines}/{valid_lines} NASM lines "
              f"across {len(assembly_files)} source files"
          )
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make rpm gnupg

      - name: Build and package
        run: |
          make
          make deb
          make rpm
          cp elfcheck "elfcheck-${GITHUB_REF_NAME}-linux-amd64"

      - name: Sign the RPM
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY secret set; shipping an unsigned RPM." >&2
            exit 0
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          if [ -z "$keyid" ]; then
            echo "error: imported GPG key but could not determine its key id" >&2
            exit 1
          fi
          passargs=()
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" > gpg-passphrase
            passargs=(GPG_PASSPHRASE_FILE="$PWD/gpg-passphrase")
          fi
          make rpm-sign GPG_NAME="$keyid" "${passargs[@]}"
          rm -f gpg-passphrase
          # Publish the matching public key so users can import and verify it.
          gpg --batch --armor --export "$keyid" > RPM-GPG-KEY-elfcheck

      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "error: CHANGELOG.md has no section for version $version" >&2
            exit 1
          fi

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("elfcheck-${GITHUB_REF_NAME}-linux-amd64" elfcheck_*_amd64.deb elfcheck-*.x86_64.rpm)
          if [ -f RPM-GPG-KEY-elfcheck ]; then assets+=(RPM-GPG-KEY-elfcheck); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md "${assets[@]}"
          fi
