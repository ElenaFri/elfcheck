name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make gcc python3 kcov

      - name: Build, test, and generate coverage
        run: make coverage

      - name: Run deterministic fuzz smoke tests
        run: make fuzz-smoke

      - name: Verify assembly coverage report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("coverage").rglob("cobertura.xml"))
          if not reports:
              raise SystemExit("kcov did not produce a Cobertura XML report")

          assembly_files = set()
          valid_lines = 0
          covered_lines = 0
          for report in reports:
              root = ET.parse(report).getroot()
              for class_node in root.findall(".//class"):
                  filename = class_node.get("filename", "")
                  if not filename.endswith((".asm", ".inc")):
                      continue
                  assembly_files.add(filename)
                  for line in class_node.findall("./lines/line"):
                      valid_lines += 1
                      covered_lines += int(line.get("hits", "0")) > 0

          if not assembly_files or not valid_lines or not covered_lines:
              raise SystemExit(
                  "kcov report has no executed NASM source lines "
                  f"(files={len(assembly_files)}, valid={valid_lines}, covered={covered_lines})"
              )

          print(
              f"kcov report covers {covered_lines}/{valid_lines} NASM lines "
              f"across {len(assembly_files)} source files"
          )
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make

      - name: Build and package
        run: |
          make
          make deb
          cp elfcheck "elfcheck-${GITHUB_REF_NAME}-linux-amd64"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("elfcheck-${GITHUB_REF_NAME}-linux-amd64" elfcheck_*_amd64.deb)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
          fi
